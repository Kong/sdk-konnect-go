name: Publish

on:
  push:
    paths:
      - ".speakeasy/gen.lock"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Releases need permissions to read and write the repository contents.
    # GitHub considers creating releases and uploading assets as writing contents.
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
      - name: Read current version + create tag
        run: |
          TAG=$(yq '.management.releaseVersion' .speakeasy/gen.lock)

          git config --global user.email "apiops@konghq.com"
          git config --global user.name "kong-apiops[bot]"

          git tag -a v$TAG -m "Release v$TAG"
          git push origin v$TAG
      - name: Mark as pre-release if applicable
        run: |
          TAG=$(yq '.management.releaseVersion' .speakeasy/gen.lock)
          echo "Released version: v$TAG"

          if [[ "$TAG" =~ -rc\.|^alpha\.|^beta\. ]]; then
            echo "This is a pre-release version"
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "This is a stable release"
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
          version: ~> v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-slack:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Slack payload
        # shortcut: one Slack section holds 3000 characters; the input table is about 1900 characters today.
        run: |
          VERSION=$(yq '.management.releaseVersion' .speakeasy/gen.lock)
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Three aligned columns, padded to the longest value. Slack has no table block.
          INPUTS=$(yq -r '.x-input-schemas[] | [.title, .version, .path] | @tsv' openapi.yaml | awk -F'\t' '
            {
              w1 = length($1) > w1 ? length($1) : w1
              w2 = length($2) > w2 ? length($2) : w2
              n++; title[n] = $1; ver[n] = $2; path[n] = $3
            }
            END { for (i = 1; i <= n; i++) printf "%-*s %-*s %s\n", w1, title[i], w2, ver[i], path[i] }')

          jq -n \
            --arg channel "project-konnect-sdks" \
            --arg version "v${VERSION}" \
            --arg release_url "$RELEASE_URL" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg inputs "$INPUTS" \
            '{
              channel: $channel,
              text: "🎉 sdk-konnect-go \($version) released: \($release_url)",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "🎉 *sdk-konnect-go <\($release_url)|\($version)>* released 🎉" } },
                { type: "section", text: { type: "mrkdwn", text: "*Workflow run:* <\($run_url)|Run #\($run_number)>" } },
                { type: "section", text: { type: "mrkdwn", text: "*Input OAS versions*\n```\n\($inputs)\n```" } }
              ]
            }' > slack-payload.json
      - name: Post release notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
