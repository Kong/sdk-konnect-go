workflowVersion: 1.0.0
speakeasyVersion: 1.806.0
sources:
    konnect:
        inputs:
            - location: ./openapi.yaml
        overlays:
            - location: ./kongctl-patches/overlays/ai-gateway-pgvector-connection-defaults.yaml
            - location: ./kongctl-patches/overlays/ai-gateway-update-runtime-defaults.yaml
            - location: ./kongctl-patches/overlays/backend-cluster-tls-defaults.yaml
            - location: ./kongctl-patches/overlays/organization-team-konnect-managed-defaults.yaml
            - location: ./kongctl-patches/overlays/patch-custom-portal-email-template-defaults.yaml
            - location: ./kongctl-patches/overlays/portal-ai-settings-patch-defaults.yaml
            - location: ./kongctl-patches/overlays/portal-customization-spec-renderer-defaults.yaml
            - location: ./kongctl-patches/overlays/portal-customization-theme-defaults.yaml
            - location: ./kongctl-patches/overlays/portal-team-konnect-managed-defaults.yaml
            - location: ./kongctl-patches/overlays/update-dcr-config-http-defaults.yaml
            - location: ./kongctl-patches/overlays/update-portal-audit-log-webhook-patch-defaults.yaml
            - location: ./kongctl-patches/overlays/update-portal-identity-provider-defaults.yaml
            - location: ./kongctl-patches/overlays/update-portal-patch-defaults.yaml
        registry:
            location: registry.speakeasyapi.dev/kong/kong/konnect
targets:
    go:
        target: go
        source: konnect
        output: .
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/kong/kong/konnect-go-code-samples
            labelOverride:
                fixedValue: Go (SDK)
            blocking: false
